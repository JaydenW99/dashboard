<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>console — personal dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14;--panel:#121924;--panel-2:#0e1420;--line:#22303f;--line-soft:#1a2431;
    --amber:#ffb454;--amber-dim:#8a6530;--teal:#5eead4;--teal-dim:#2f6e63;--red:#ff6b6b;
    --green:#7ee787;--text:#e6edf3;--text-dim:#7d8b99;--text-faint:#4b5866;
  }
  *{box-sizing:border-box}
  body{margin:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px),var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:28px 20px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;gap:18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
  .brand{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--amber);letter-spacing:.5px}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--amber);margin-left:2px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .clock{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);text-align:right}
  .tabs{display:flex;gap:2px;margin-bottom:22px;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:fit-content;max-width:100%}
  .tab{font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 16px;cursor:pointer;color:var(--text-dim);background:var(--panel-2);user-select:none;border-right:1px solid var(--line);white-space:nowrap}.tab:last-child{border-right:none}.tab:hover{color:var(--text)}.tab.active{background:var(--panel);color:var(--amber)}.tab .n{color:var(--text-faint);margin-right:6px}.tab.active .n{color:var(--amber-dim)}
  .section{display:none}.section.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px}
  .card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .card-title{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase}.prompt{color:var(--amber)}
  .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nav-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);min-width:165px;text-align:center}
  button{background:transparent;border:1px solid var(--amber-dim);color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 14px;border-radius:5px;cursor:pointer}button:hover{background:rgba(255,180,84,.08)}
  .btn-ghost{border-color:var(--line);color:var(--text-dim)}.btn-ghost:hover{color:var(--text);background:var(--panel-2)}
  .btn-x{border:none;color:var(--text-faint);padding:2px 6px;font-size:14px;background:none}.btn-x:hover{color:var(--red);background:none}
  input[type=text],input[type=number],input[type=time],input[type=date],select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;border-radius:5px;min-width:0}input:focus,select:focus{outline:none;border-color:var(--amber-dim)}
  .row-add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.grow{flex:1 1 220px}.small{flex:0 1 140px}
  .stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px}.stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.stat-val{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--text)}.teal{color:var(--teal)}.amber{color:var(--amber)}.red{color:var(--red)}
  /* WEEK */
  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}.day-col{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;min-height:280px;padding:10px}.day-col.today{border-color:var(--amber-dim)}.day-head{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;gap:6px}.day-col.today .day-head{color:var(--amber)}.event{border-left:2px solid var(--teal-dim);background:#101a24;border-radius:4px;padding:8px 8px 8px 9px;margin-bottom:7px;position:relative}.event-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--teal);margin-bottom:3px}.event-title{font-size:12px;line-height:1.35;padding-right:16px}.event .del{position:absolute;right:4px;top:3px;color:var(--text-faint);cursor:pointer;font-size:12px}.event .del:hover{color:var(--red)}
  /* TASKS */
  .task-list{display:flex;flex-direction:column}.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}.task:first-child{border-top:none}.check{width:21px;height:21px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);cursor:pointer}.check.done{background:var(--teal-dim);border-color:var(--teal);position:relative}.check.done:after{content:'✓';position:absolute;inset:0;text-align:center;line-height:19px;color:var(--teal);font-size:13px}.task.done .task-name{text-decoration:line-through;color:var(--text-faint)}.task-name{font-size:14px}.tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 6px;border:1px solid var(--line);border-radius:999px;color:var(--text-dim)}.tag.high{color:var(--red);border-color:#60343a}.tag.medium{color:var(--amber);border-color:var(--amber-dim)}.tag.low{color:var(--teal);border-color:var(--teal-dim)}
  /* FINANCE */
  .finance-cols{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.subcard{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;padding:14px}.subhead{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px}.tx{display:grid;grid-template-columns:90px 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft);font-size:12px}.tx:first-child{border-top:none}.tx-date{font-family:'JetBrains Mono',monospace;color:var(--text-faint);font-size:10px}.tx-cat{color:var(--text-dim);font-size:11px}.tx-amt{font-family:'JetBrains Mono',monospace}.tx-amt.income{color:var(--teal)}.tx-amt.expense{color:var(--amber)}.cat-row{margin:10px 0}.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:12px}.cat-amt{font-family:'JetBrains Mono',monospace}.bar-track{height:6px;background:#0b1119;border:1px solid var(--line-soft);border-radius:4px;overflow:hidden;margin-top:5px}.bar-fill{height:100%;background:var(--amber-dim)}
  .empty{color:var(--text-faint);font-size:12px;font-style:italic;padding:8px 0}.footer-note{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:24px;text-align:center}
  @media(max-width:760px){body{padding:18px 12px 40px}.tabs{width:100%}.tab{flex:1;text-align:center;padding:9px 8px}.tab .n{display:none}.stat-row{grid-template-columns:1fr}.finance-cols{grid-template-columns:1fr}.card{padding:15px}.week-grid{grid-template-columns:repeat(7,160px)}.task{grid-template-columns:auto 1fr auto}.task .tag{display:none}.tx{grid-template-columns:72px 1fr auto}.tx .tx-cat{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">~/dashboard<span class="cursor"></span></div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="week"><span class="n">01</span>weekly planner</div>
    <div class="tab" data-tab="tasks"><span class="n">02</span>daily tasks</div>
    <div class="tab" data-tab="finance"><span class="n">03</span>finances</div>
  </div>

  <section class="section active" id="sec-week">
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="prompt">$</span> week plan</div>
        <div class="nav">
          <button class="btn-ghost" onclick="shiftWeek(-1)">←</button>
          <div class="nav-label" id="week-label"></div>
          <button class="btn-ghost" onclick="shiftWeek(1)">→</button>
          <button onclick="goCurrentWeek()">today</button>
        </div>
      </div>
      <div class="week-grid" id="week-grid"></div>
      <div class="row-add">
        <select id="event-day" class="small"></select>
        <input type="time" id="event-time" class="small" value="09:00">
        <input type="text" id="event-title" class="grow" placeholder="plan, e.g. University / Gym / Study">
        <button onclick="addEvent()">add plan</button>
      </div>
    </div>
  </section>

  <section class="section" id="sec-tasks">
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="prompt">$</span> tasks</div>
        <div class="nav">
          <button class="btn-ghost" onclick="shiftTaskDay(-1)">←</button>
          <div class="nav-label" id="task-date-label"></div>
          <button class="btn-ghost" onclick="shiftTaskDay(1)">→</button>
          <button onclick="goTodayTasks()">today</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-label">total</div><div class="stat-val" id="task-total">0</div></div>
        <div class="stat"><div class="stat-label">completed</div><div class="stat-val teal" id="task-done">0</div></div>
        <div class="stat"><div class="stat-label">left</div><div class="stat-val amber" id="task-left">0</div></div>
      </div>
      <div class="task-list" id="task-list"></div>
      <div class="row-add">
        <input type="text" id="task-name" class="grow" placeholder="new task">
        <select id="task-priority" class="small"><option value="medium">medium</option><option value="high">high</option><option value="low">low</option></select>
        <button onclick="addTask()">add task</button>
      </div>
    </div>
  </section>

  <section class="section" id="sec-finance">
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="prompt">$</span> monthly finances</div>
        <div class="nav">
          <button class="btn-ghost" onclick="shiftMonth(-1)">←</button>
          <div class="nav-label" id="month-label"></div>
          <button class="btn-ghost" onclick="shiftMonth(1)">→</button>
          <button onclick="goCurrentMonth()">this month</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-label">income</div><div class="stat-val teal" id="fin-income">€0</div></div>
        <div class="stat"><div class="stat-label">spent</div><div class="stat-val amber" id="fin-spent">€0</div></div>
        <div class="stat"><div class="stat-label">remaining</div><div class="stat-val" id="fin-remaining">€0</div></div>
      </div>
      <div class="finance-cols">
        <div class="subcard">
          <div class="subhead">expense categories</div>
          <div id="category-list"></div>
        </div>
        <div class="subcard">
          <div class="subhead">transactions</div>
          <div id="transaction-list"></div>
        </div>
      </div>
      <div class="row-add">
        <input type="date" id="tx-date" class="small">
        <select id="tx-type" class="small"><option value="expense">expense</option><option value="income">income</option></select>
        <input type="text" id="tx-category" class="small" placeholder="category">
        <input type="text" id="tx-name" class="grow" placeholder="description">
        <input type="number" id="tx-amount" class="small" placeholder="€ amount" min="0" step="0.01">
        <button onclick="addTransaction()">add</button>
      </div>
    </div>
  </section>

  <div class="footer-note">saved locally in your browser · no account or database required</div>
</div>
<script>
const STORAGE_KEY = 'dashboard-state-v2';
const LEGACY_KEY = 'dashboard-state';
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let weekStart = startOfWeek(new Date());
let taskDate = stripTime(new Date());
let financeMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let state = loadState();

function defaultState(){ return {events:[],tasks:[],transactions:[]}; }
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return normalizeState(JSON.parse(raw));
    const legacyRaw = localStorage.getItem(LEGACY_KEY);
    if(legacyRaw){
      const legacy = JSON.parse(legacyRaw);
      const migrated = defaultState();
      const today = isoDate(new Date());
      (legacy.income||[]).forEach(x=>migrated.transactions.push({id:uid(),date:today,type:'income',category:'Income',name:x.name,amount:Number(x.amt)||0}));
      (legacy.expenses||[]).forEach(x=>migrated.transactions.push({id:uid(),date:today,type:'expense',category:x.name||'Other',name:x.name||'Expense',amount:Number(x.amt)||0}));
      localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
      return migrated;
    }
  }catch(e){ console.warn('Could not load saved data',e); }
  return defaultState();
}
function normalizeState(s){
  const tasks=(Array.isArray(s.tasks)?s.tasks:[]).map(t=>{
    const x={...t};
    if(x.done && !x.completedDate) x.completedDate=x.date;
    delete x.done;
    return x;
  });
  return {events:Array.isArray(s.events)?s.events:[],tasks,transactions:Array.isArray(s.transactions)?s.transactions:[]};
}
function saveState(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function stripTime(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function startOfWeek(d){ const x=stripTime(d), day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function money(n){ return new Intl.NumberFormat(undefined,{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function tick(){ const d=new Date(); document.getElementById('clock').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'  '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
tick();setInterval(tick,30000);

document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('sec-'+t.dataset.tab).classList.add('active');});

function shiftWeek(n){ weekStart=addDays(weekStart,n*7); renderWeek(); }
function goCurrentWeek(){ weekStart=startOfWeek(new Date()); renderWeek(); }
function renderWeek(){
  const end=addDays(weekStart,6);
  document.getElementById('week-label').textContent=`${weekStart.toLocaleDateString(undefined,{day:'numeric',month:'short'})} – ${end.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}`;
  const today=isoDate(new Date());
  const grid=document.getElementById('week-grid');
  grid.innerHTML=DAY_NAMES.map((name,i)=>{
    const d=addDays(weekStart,i), key=isoDate(d), events=state.events.filter(x=>x.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    return `<div class="day-col ${key===today?'today':''}"><div class="day-head"><span>${name.slice(0,3)}</span><span>${d.getDate()}</span></div>${events.map(ev=>`<div class="event"><span class="del" onclick="deleteEvent('${ev.id}')">✕</span><div class="event-time">${esc(ev.time||'')}</div><div class="event-title">${esc(ev.title)}</div></div>`).join('')||'<div class="empty">no plans</div>'}</div>`;
  }).join('');
  const select=document.getElementById('event-day');
  select.innerHTML=DAY_NAMES.map((name,i)=>{const d=addDays(weekStart,i);return `<option value="${isoDate(d)}">${name} ${d.getDate()}</option>`}).join('');
}
function addEvent(){ const title=document.getElementById('event-title').value.trim(); if(!title)return; state.events.push({id:uid(),date:document.getElementById('event-day').value,time:document.getElementById('event-time').value,title}); document.getElementById('event-title').value=''; saveState();renderWeek(); }
function deleteEvent(id){ state.events=state.events.filter(x=>x.id!==id);saveState();renderWeek(); }

function shiftTaskDay(n){ taskDate=addDays(taskDate,n);renderTasks(); }
function goTodayTasks(){ taskDate=stripTime(new Date());renderTasks(); }
function renderTasks(){
  const key=isoDate(taskDate);
  const items=state.tasks
    .filter(t=>t.date<=key && (!t.completedDate || t.completedDate>=key))
    .sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('task-date-label').textContent=taskDate.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const done=items.filter(t=>t.completedDate===key).length;
  const left=items.length-done;
  document.getElementById('task-total').textContent=items.length;
  document.getElementById('task-done').textContent=done;
  document.getElementById('task-left').textContent=left;
  document.getElementById('task-list').innerHTML=items.length?items.map(t=>{
    const isDone=t.completedDate===key;
    const carried=t.date<key && !isDone;
    const carriedLabel=carried?`<span class="tag">carried from ${parseISO(t.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>`:'';
    return `<div class="task ${isDone?'done':''}"><div class="check ${isDone?'done':''}" onclick="toggleTask('${t.id}')"></div><div class="task-name">${esc(t.name)} ${carriedLabel}</div><span class="tag ${esc(t.priority)}">${esc(t.priority)}</span><button class="btn-x" onclick="deleteTask('${t.id}')">✕</button></div>`;
  }).join(''):'<div class="empty">no tasks for this day</div>';
}
function addTask(){ const name=document.getElementById('task-name').value.trim(); if(!name)return; state.tasks.push({id:uid(),date:isoDate(taskDate),name,priority:document.getElementById('task-priority').value,completedDate:null});document.getElementById('task-name').value='';saveState();renderTasks(); }
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(!t)return;
  const key=isoDate(taskDate);
  t.completedDate=t.completedDate===key?null:key;
  saveState();renderTasks();
}
function deleteTask(id){ state.tasks=state.tasks.filter(x=>x.id!==id);saveState();renderTasks(); }

function shiftMonth(n){ financeMonth=new Date(financeMonth.getFullYear(),financeMonth.getMonth()+n,1);renderFinance(); }
function goCurrentMonth(){ const n=new Date();financeMonth=new Date(n.getFullYear(),n.getMonth(),1);renderFinance(); }
function renderFinance(){
  document.getElementById('month-label').textContent=financeMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const y=financeMonth.getFullYear(),m=financeMonth.getMonth();
  const txs=state.transactions.filter(t=>{const d=parseISO(t.date);return d.getFullYear()===y&&d.getMonth()===m;}).sort((a,b)=>b.date.localeCompare(a.date));
  const income=txs.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0), spent=txs.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0), remaining=income-spent;
  document.getElementById('fin-income').textContent=money(income);document.getElementById('fin-spent').textContent=money(spent);const rem=document.getElementById('fin-remaining');rem.textContent=money(remaining);rem.className='stat-val '+(remaining<0?'red':'teal');
  document.getElementById('transaction-list').innerHTML=txs.length?txs.map(t=>`<div class="tx"><div class="tx-date">${parseISO(t.date).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</div><div><div>${esc(t.name)}</div><div class="tx-cat">${esc(t.category||'Other')}</div></div><div class="tx-amt ${t.type}">${t.type==='income'?'+':'−'}${money(t.amount)}</div><button class="btn-x" onclick="deleteTransaction('${t.id}')">✕</button></div>`).join(''):'<div class="empty">no transactions this month</div>';
  const cats={};txs.filter(t=>t.type==='expense').forEach(t=>{const c=t.category||'Other';cats[c]=(cats[c]||0)+Number(t.amount||0)});const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=Math.max(...entries.map(x=>x[1]),1);
  document.getElementById('category-list').innerHTML=entries.length?entries.map(([c,v])=>`<div class="cat-row"><div class="cat-top"><span>${esc(c)}</span><span class="cat-amt">${money(v)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div></div>`).join(''):'<div class="empty">no expenses yet</div>';
  const today=new Date(); const suggested=(today.getFullYear()===y&&today.getMonth()===m)?today:new Date(y,m,1); document.getElementById('tx-date').value=isoDate(suggested);
}
function addTransaction(){ const amount=parseFloat(document.getElementById('tx-amount').value),name=document.getElementById('tx-name').value.trim(),date=document.getElementById('tx-date').value;if(!date||!name||!amount||amount<=0)return;const type=document.getElementById('tx-type').value;state.transactions.push({id:uid(),date,type,category:document.getElementById('tx-category').value.trim()||(type==='income'?'Income':'Other'),name,amount});document.getElementById('tx-name').value='';document.getElementById('tx-category').value='';document.getElementById('tx-amount').value='';saveState();renderFinance(); }
function deleteTransaction(id){ state.transactions=state.transactions.filter(x=>x.id!==id);saveState();renderFinance(); }

renderWeek();renderTasks();renderFinance();
</script>
</body>
</html>
